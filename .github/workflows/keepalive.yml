name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity.
# The data lands on the `site` branch, so touch `main` once a month to be safe.
on:
  schedule:
    - cron: '5 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .github/last-keepalive
          git config user.name "oracle-data-bot"
          git config user.email "oracle-data-bot@users.noreply.github.com"
          git add .github/last-keepalive
          git commit -m "keepalive" && git push
